  <rect width="1056" height="1190" fill="#05070a" />
  <text x="20" y="30" class="h">
    The grille becomes the chamber’s forward end
  </text>
  <text x="20" y="53" class="n">
    Same manual front and scale; same provisional dark chamber. Six local
    treatments of the surrounding planes and overlaps.
  </text>
  <text x="20" y="89" class="k">EXPOSED CHAMBER / A–C</text>
  <g transform="translate(0 105)">
    <path d="M0 0H352M0 0V505" stroke="#26313c" fill="none" />
    <text x="16" y="29" class="h">A / Side saddles</text>
    <text x="16" y="53" class="n">
      Dark canister continues out of the grille.
    </text>
    <text x="16" y="82" class="k">TRANSITION</text>
    <text x="248" y="82" class="k">WHOLE</text>
    <svg x="16" y="96" width="216" height="324" viewBox="-5.4 -7 10.8 16.2">
      <title>045 grille transitions</title>
      <g style="isolation:isolate"><use href="#assembly-a" /></g>
    </svg>
    <g
      class="whole"
      transform="translate(281 275) scale(6)"
      style="isolation:isolate"
    >
      <use href="#assembly-a" />
    </g>
    <text x="16" y="458" class="k">
      Pale shoulders hold its sides; most of it remains exposed.
    </text>
  </g>
  <g transform="translate(352 105)">
    <path d="M0 0H352M0 0V505" stroke="#26313c" fill="none" />
    <text x="16" y="29" class="h">B / Overlapping collar</text>
    <text x="16" y="53" class="n">
      The banded transition opens into a blue collar.
    </text>
    <text x="16" y="82" class="k">TRANSITION</text>
    <text x="248" y="82" class="k">WHOLE</text>
    <svg x="16" y="96" width="216" height="324" viewBox="-5.4 -7 10.8 16.2">
      <title>045 grille transitions</title>
      <g style="isolation:isolate"><use href="#assembly-b" /></g>
    </svg>
    <g
      class="whole"
      transform="translate(281 275) scale(6)"
      style="isolation:isolate"
    >
      <use href="#assembly-b" />
    </g>
    <text x="16" y="458" class="k">
      One low fold crosses the canister; its rear stays visible.
    </text>
  </g>
  <g transform="translate(704 105)">
    <path d="M0 0H352M0 0V505" stroke="#26313c" fill="none" />
    <text x="16" y="29" class="h">C / Chamber above a seat</text>
    <text x="16" y="53" class="n">
      The canister sits proud of a lower blue body.
    </text>
    <text x="16" y="82" class="k">TRANSITION</text>
    <text x="248" y="82" class="k">WHOLE</text>
    <svg x="16" y="96" width="216" height="324" viewBox="-5.4 -7 10.8 16.2">
      <title>045 grille transitions</title>
      <g style="isolation:isolate"><use href="#assembly-c" /></g>
    </svg>
    <g
      class="whole"
      transform="translate(281 275) scale(6)"
      style="isolation:isolate"
    >
      <use href="#assembly-c" />
    </g>
    <text x="16" y="458" class="k">
      Short cheeks meet the grille; the seat appears behind it.
    </text>
  </g>
  <text x="20" y="629" class="k">HOUSED CHAMBER / D–F</text>
  <g transform="translate(0 645)">
    <path d="M0 0H352M0 0V505" stroke="#26313c" fill="none" />
    <text x="16" y="29" class="h">D / Recessed centre</text>
    <text x="16" y="53" class="n">
      Sloping covers narrow the visible chamber.
    </text>
    <text x="16" y="82" class="k">TRANSITION</text>
    <text x="248" y="82" class="k">WHOLE</text>
    <svg x="16" y="96" width="216" height="324" viewBox="-5.4 -7 10.8 16.2">
      <title>045 grille transitions</title>
      <g style="isolation:isolate"><use href="#assembly-d" /></g>
    </svg>
    <g
      class="whole"
      transform="translate(281 275) scale(6)"
      style="isolation:isolate"
    >
      <use href="#assembly-d" />
    </g>
    <text x="16" y="458" class="k">
      The grille leads into a dark working strip between covers.
    </text>
  </g>
  <g transform="translate(352 645)">
    <path d="M0 0H352M0 0V505" stroke="#26313c" fill="none" />
    <text x="16" y="29" class="h">E / Covered chamber</text>
    <text x="16" y="53" class="n">
      A blue roof takes over behind the grille.
    </text>
    <text x="16" y="82" class="k">TRANSITION</text>
    <text x="248" y="82" class="k">WHOLE</text>
    <svg x="16" y="96" width="216" height="324" viewBox="-5.4 -7 10.8 16.2">
      <title>045 grille transitions</title>
      <g style="isolation:isolate"><use href="#assembly-e" /></g>
    </svg>
    <g
      class="whole"
      transform="translate(281 275) scale(6)"
      style="isolation:isolate"
    >
      <use href="#assembly-e" />
    </g>
    <text x="16" y="458" class="k">
      The dark chamber is suggested at the joint and rear cap.
    </text>
  </g>
  <g transform="translate(704 645)">
    <path d="M0 0H352M0 0V505" stroke="#26313c" fill="none" />
    <text x="16" y="29" class="h">F / Side reveal</text>
    <text x="16" y="53" class="n">
      One broad cover and one narrow retaining side.
    </text>
    <text x="16" y="82" class="k">TRANSITION</text>
    <text x="248" y="82" class="k">WHOLE</text>
    <svg x="16" y="96" width="216" height="324" viewBox="-5.4 -7 10.8 16.2">
      <title>045 grille transitions</title>
      <g style="isolation:isolate"><use href="#assembly-f" /></g>
    </svg>
    <g
      class="whole"
      transform="translate(281 275) scale(6)"
      style="isolation:isolate"
    >
      <use href="#assembly-f" />
    </g>
    <text x="16" y="458" class="k">
      An unequal opening reveals a strip of the same chamber.
    </text>
  </g>
  <text x="20" y="1171" class="k">
    Close-ups share one scale; whole weapons share another. Original channel
    paths and source-art dimensions are fixed. Exhausts remain deferred.
  </text>
</svg>
