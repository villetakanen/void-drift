    transform="translate(491 297) scale(10.5) translate(-246.684809 -102.705067)"
  />
  <g transform="translate(846 338) scale(8)" style="isolation:isolate">
    <use href="#active" />
  </g>
  <text x="82" y="427" class="s">
    Dark barrel through a shorter blue housing.
  </text>
  <text x="388" y="427" class="s">
    Related assembly carried by a round base.
  </text>
  <text x="746" y="427" class="s">
    Long open working part through a receiver.
  </text>
  <text x="22" y="463" class="s">
    Existing weapons are reference enlargements, not a fitted-size comparison.
    The plasma blades keep their supplied source-art dimensions.
  </text>
  <path d="M22 487H1034" stroke="#26313c" />
  <text x="72" y="528" class="h">Receiver and chamber / World artwork</text>
  <text x="588" y="528" class="h">Same assembly / supplied plasma light</text>
  <svg x="82" y="558" width="360" height="450" viewBox="-7.2 -11.5 14.4 18">
    <title>046 receiver proposal</title>
    <g style="isolation:isolate"><use href="#world" /></g>
  </svg>
  <svg x="598" y="558" width="360" height="450" viewBox="-7.2 -11.5 14.4 18">
    <title>046 receiver proposal</title>
    <g style="isolation:isolate"><use href="#active" /></g>
  </svg>
  <text x="22" y="1048" class="n">
    The receiver overlaps the lower blades. A two-band grille joins them to a
    short chamber projecting behind the blue crosspiece.
  </text>
  <text x="22" y="1080" class="s">
    Blade paths and scale fixed. Grille redrawn. Housing and chamber
    provisional. No exhaust pipes, new ship mounts or production changes.
  </text>
</svg>
