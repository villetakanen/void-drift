  <rect width="1056" height="1100" fill="#05070a" />
  <text x="22" y="34" class="h">A compact receiver around the blades</text>
  <text x="22" y="61" class="n">
    One fresh proposal from 02.2’s weapon construction. No 02.25 candidate is
    developed here.
  </text>
  <text x="96" y="112" class="h">Ion cannon / existing</text>
  <text x="398" y="112" class="h">Point defence / existing</text>
  <text x="762" y="112" class="h">Plasma / proposal</text>
