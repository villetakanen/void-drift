<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1056"
  height="730"
  viewBox="0 0 1056 730"
  role="img"
  aria-labelledby="title desc"
  style="isolation:isolate"
>
  <title id="title">Burning-orange light in a fixed plasma channel</title>
  <desc id="desc">
    Three static light profiles on the same neutral channel: a narrow hot seam,
    a broader hot volume and a broad bright bed. The browser blends each source
    over identical equipment using hard-light, without bloom. Source cross
    sections and smaller composed drawings are included. This isolates the
    appearance of plasma inside the selected channel, without proposing a
    finished weapon.
  </desc>
  <rect width="1056" height="730" fill="#070711" />
  <style>
  text {
    font: 12px monospace;
    fill: #a4a7b2;
    text-anchor: middle;
  }
  .title {
    font: 600 18px sans-serif;
    fill: #e0e4e9;
  }
  .small {
    font-size: 10px;
  }
  .light {
    mix-blend-mode: hard-light;
  }
  .line {
    stroke: #2c303b;
    stroke-width: 1;
  }
  </style>
  <defs>
    <!-- Authored SVG light sources; all profiles share hue family, opacity endpoints,
     axial fade, channel dimensions and neutral equipment. Only transverse falloff varies.
     Values are a static source experiment; no chosen timing or production painter. -->
    <linearGradient
      id="seam"
      gradientUnits="userSpaceOnUse"
      x1="-1.35"
      y1="0"
      x2="1.35"
      y2="0"
    >
      <stop offset="0" stop-color="#ff5c10" stop-opacity="0" />
      <stop offset=".27" stop-color="#ff5c10" stop-opacity=".07" />
      <stop offset=".43" stop-color="#ff961f" stop-opacity=".55" />
      <stop offset=".485" stop-color="#ffe6a5" />
      <stop offset=".5" stop-color="#fff9e9" />
      <stop offset=".515" stop-color="#ffe6a5" />
      <stop offset=".57" stop-color="#ff961f" stop-opacity=".55" />
      <stop offset=".73" stop-color="#ff5c10" stop-opacity=".07" />
      <stop offset="1" stop-color="#ff5c10" stop-opacity="0" />
    </linearGradient>
    <linearGradient
      id="volume"
      gradientUnits="userSpaceOnUse"
      x1="-1.35"
      y1="0"
      x2="1.35"
      y2="0"
    >
      <stop offset="0" stop-color="#ff5c10" stop-opacity="0" />
      <stop offset=".14" stop-color="#ff5c10" stop-opacity=".12" />
      <stop offset=".29" stop-color="#ff961f" stop-opacity=".8" />
      <stop offset=".43" stop-color="#ffe6a5" />
      <stop offset=".5" stop-color="#fff9e9" />
      <stop offset=".57" stop-color="#ffe6a5" />
      <stop offset=".71" stop-color="#ff961f" stop-opacity=".8" />
      <stop offset=".86" stop-color="#ff5c10" stop-opacity=".12" />
      <stop offset="1" stop-color="#ff5c10" stop-opacity="0" />
    </linearGradient>
    <linearGradient
      id="bed"
      gradientUnits="userSpaceOnUse"
      x1="-1.35"
      y1="0"
      x2="1.35"
      y2="0"
    >
      <stop offset="0" stop-color="#ff5c10" stop-opacity="0" />
      <stop offset=".08" stop-color="#ff5c10" stop-opacity=".15" />
      <stop offset=".2" stop-color="#ff961f" stop-opacity=".9" />
      <stop offset=".34" stop-color="#ffe6a5" />
      <stop offset=".43" stop-color="#fff9e9" />
      <stop offset=".57" stop-color="#fff9e9" />
      <stop offset=".66" stop-color="#ffe6a5" />
      <stop offset=".8" stop-color="#ff961f" stop-opacity=".9" />
      <stop offset=".92" stop-color="#ff5c10" stop-opacity=".15" />
      <stop offset="1" stop-color="#ff5c10" stop-opacity="0" />
    </linearGradient>
    <linearGradient
      id="axial-fade"
      gradientUnits="userSpaceOnUse"
      x1="0"
      y1="-4.1"
      x2="0"
      y2="4.1"
    >
      <stop offset="0" stop-color="white" stop-opacity="0" />
      <stop offset=".08" stop-color="white" />
      <stop offset=".92" stop-color="white" />
      <stop offset="1" stop-color="white" stop-opacity="0" />
    </linearGradient>
    <mask
      id="ends"
      maskUnits="userSpaceOnUse"
      x="-2"
      y="-4.1"
      width="4"
      height="8.2"
    >
      <rect x="-2" y="-4.1" width="4" height="8.2" fill="url(#axial-fade)" />
    </mask>
    <!-- Neutral equipment section, viewed from above. The open channel is 1.5 u wide.
     A dark bed and light/dark walls deliberately reveal the hard-light interaction. -->
    <g id="world-section">
      <rect x="-.75" y="-4.1" width="1.5" height="8.2" fill="#0b1017" />
      <path fill="#3d4147" d="M-1.6 -4.1H-.75V4.1H-1.6Z" />
      <path fill="#66717b" d="M-1.6 -4.1H-1.35V4.1H-1.6Z" />
      <path fill="#12171e" d="M-.98 -4.1H-.75V4.1H-.98Z" />
      <path fill="#1b1d1f" d="M.75 -4.1H1.6V4.1H.75Z" />
      <path fill="#344450" d="M.75 -4.1H.98V4.1H.75Z" />
      <path fill="#303943" d="M1.35 -4.1H1.6V4.1H1.35Z" />
    </g>
  </defs>
  <text x="176" y="32" class="title">A / Hot seam</text>
  <g
    id="composed-seam"
    style="isolation:isolate"
    transform="translate(176 202) scale(32)"
  >
    <use href="#world-section" />
    <g class="light" mask="url(#ends)">
      <rect x="-1.35" y="-4.1" width="2.7" height="8.2" fill="url(#seam)" />
    </g>
  </g>
  <text x="176" y="365">Composed · hard-light · 32 image px/u</text>
  <g transform="translate(176 427) scale(80 50)">
    <rect x="-1.35" y="-.2" width="2.7" height=".4" fill="url(#seam)" />
  </g>
  <text x="176" y="465">Source cross section · normal blend</text>
  <g style="isolation:isolate" transform="translate(124 552) scale(6)">
    <use href="#world-section" />
    <g class="light" mask="url(#ends)">
      <rect x="-1.35" y="-4.1" width="2.7" height="8.2" fill="url(#seam)" />
    </g>
  </g>
  <g style="isolation:isolate" transform="translate(228 552) scale(1)">
    <use href="#world-section" />
    <g class="light" mask="url(#ends)">
      <rect x="-1.35" y="-4.1" width="2.7" height="8.2" fill="url(#seam)" />
    </g>
  </g>
  <text x="124" y="607" class="small">6 image px/u</text>
  <text x="228" y="607" class="small">1 image px/u</text>
  <text x="528" y="32" class="title">B / Hot volume</text>
  <g
    id="composed-volume"
    style="isolation:isolate"
    transform="translate(528 202) scale(32)"
  >
    <use href="#world-section" />
    <g class="light" mask="url(#ends)">
      <rect x="-1.35" y="-4.1" width="2.7" height="8.2" fill="url(#volume)" />
    </g>
  </g>
  <text x="528" y="365">Composed · hard-light · 32 image px/u</text>
  <g transform="translate(528 427) scale(80 50)">
    <rect x="-1.35" y="-.2" width="2.7" height=".4" fill="url(#volume)" />
  </g>
  <text x="528" y="465">Source cross section · normal blend</text>
  <g style="isolation:isolate" transform="translate(476 552) scale(6)">
    <use href="#world-section" />
    <g class="light" mask="url(#ends)">
      <rect x="-1.35" y="-4.1" width="2.7" height="8.2" fill="url(#volume)" />
    </g>
  </g>
  <g style="isolation:isolate" transform="translate(580 552) scale(1)">
    <use href="#world-section" />
    <g class="light" mask="url(#ends)">
      <rect x="-1.35" y="-4.1" width="2.7" height="8.2" fill="url(#volume)" />
    </g>
  </g>
  <text x="476" y="607" class="small">6 image px/u</text>
  <text x="580" y="607" class="small">1 image px/u</text>
  <text x="880" y="32" class="title">C / Bright bed</text>
  <g
    id="composed-bed"
    style="isolation:isolate"
    transform="translate(880 202) scale(32)"
  >
    <use href="#world-section" />
    <g class="light" mask="url(#ends)">
      <rect x="-1.35" y="-4.1" width="2.7" height="8.2" fill="url(#bed)" />
    </g>
  </g>
  <text x="880" y="365">Composed · hard-light · 32 image px/u</text>
  <g transform="translate(880 427) scale(80 50)">
    <rect x="-1.35" y="-.2" width="2.7" height=".4" fill="url(#bed)" />
  </g>
  <text x="880" y="465">Source cross section · normal blend</text>
  <g style="isolation:isolate" transform="translate(828 552) scale(6)">
    <use href="#world-section" />
    <g class="light" mask="url(#ends)">
      <rect x="-1.35" y="-4.1" width="2.7" height="8.2" fill="url(#bed)" />
    </g>
  </g>
  <g style="isolation:isolate" transform="translate(932 552) scale(1)">
    <use href="#world-section" />
    <g class="light" mask="url(#ends)">
      <rect x="-1.35" y="-4.1" width="2.7" height="8.2" fill="url(#bed)" />
    </g>
  </g>
  <text x="828" y="607" class="small">6 image px/u</text>
  <text x="932" y="607" class="small">1 image px/u</text>
  <path
    class="line"
    d="M352 10V641M704 10V641M0 388H1056M0 488H1056M0 641H1056"
  />
  <text x="528" y="670">
    Same 1.5 × 8.2 u channel · fixed neutral World colours · only lateral light
    falloff changes
  </text>
  <text x="528" y="694" class="small">
    Native browser hard-light · no filter, bloom, FX history, animation or
    charging sequence
  </text>
  <text x="528" y="716" class="small">
    SVG source experiment · not a weapon-art proposal or a production effect ·
    game-scale row is exact at native 1056 px sheet width
  </text>
</svg>
