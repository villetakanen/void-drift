  <rect width="1056" height="760" fill="#05070a" />
  <text x="20" y="30" class="h">
    Existing artwork / canister, throat and copied connector
  </text>
  <text x="20" y="52" class="n">
    Exact source shapes. Panels enlarged independently for inspection; these are
    not weapon-size proposals.
  </text>
  <g transform="translate(0 75)" color="#ffb52e">
    <path d="M0 0H352M0 0V315" stroke="#26313c" />
    <text x="18" y="28" class="h">01 / Complete engine</text>
    <text x="18" y="49" class="n">Catalog pose; original amber outlet.</text>
    <use href="#engine" transform="translate(176 178) scale(10) rotate(-90)" />
  </g>
  <g transform="translate(352 75)" color="#ffb52e">
    <path d="M0 0H352M0 0V315" stroke="#26313c" />
    <text x="18" y="28" class="h">02 / Canister body</text>
    <text x="18" y="49" class="n">Broad faces and a narrow armor edge.</text>
    <use href="#body" transform="translate(176 178) scale(10) rotate(-90)" />
  </g>
  <g transform="translate(704 75)" color="#ffb52e">
    <path d="M0 0H352M0 0V315" stroke="#26313c" />
    <text x="18" y="28" class="h">03 / Face construction</text>
    <text x="18" y="49" class="n">Lit face, dark face, clipped ends.</text>
    <use href="#planes" transform="translate(176 178) scale(10) rotate(-90)" />
  </g>
  <g transform="translate(0 400)" color="#ffb52e">
    <path d="M0 0H352M0 0V315" stroke="#26313c" />
    <text x="18" y="28" class="h">04 / Armor edge</text>
    <text x="18" y="49" class="n">One long bright strip; no fine straps.</text>
    <use href="#edge" transform="translate(176 178) scale(10) rotate(-90)" />
  </g>
  <g transform="translate(352 400)" color="#ffb52e">
    <path d="M0 0H352M0 0V315" stroke="#26313c" />
    <text x="18" y="28" class="h">05 / Engine end / grille</text>
    <text x="18" y="49" class="n">
      Two coarse bands across a tapered throat.
    </text>
    <use href="#throat" transform="translate(176 30) scale(20) rotate(-90)" />
  </g>
  <g transform="translate(704 400)" color="#ffb52e">
    <path d="M0 0H352M0 0V315" stroke="#26313c" />
    <text x="18" y="28" class="h">06 / Your channel connector</text>
    <text x="18" y="49" class="n">
      Stepped body; split-lit transverse bands.
    </text>
    <use href="#connector" transform="translate(176 195) scale(36)" />
  </g>
  <text x="20" y="743" class="n">
    Engine: ENGINE_ART.plasma[0]. Connector: unchanged paths from the supplied
    manual SVG. No new rear assembly drawn.
  </text>
