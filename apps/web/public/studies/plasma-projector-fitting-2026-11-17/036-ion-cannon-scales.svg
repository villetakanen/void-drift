  <title id="title">
    Production ion cannon at 1, 2, 4, 8 and 16 CSS pixels per world unit
  </title>
  <desc id="desc">
    The exact same current ion cannon paths at five real display sizes. At 1
    times the cannon is 16 CSS pixels long and 4.33 pixels wide; at 16 times it
    is 256 pixels long and 69.29 pixels wide. Each image labels its footprint
    and blue-channel width. The drawings share a forward-tip alignment and are
    vector rerenders, not enlarged screenshots.
  </desc>
