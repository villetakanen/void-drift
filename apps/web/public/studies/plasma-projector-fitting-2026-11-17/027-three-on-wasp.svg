<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1056"
  height="890"
  viewBox="0 0 1056 890"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Three rough plasma weapons on the Wasp</title>
  <desc id="desc">
    Spine, a narrow long emitter in a short saddle; Split crown, a short open
    fork in a transverse receiver; and Offset breech, a stepped barrel beside an
    asymmetric power housing. Each is drawn dark and loading, isolated, exposed
    above the left Wasp wing, under the wing, and at one image pixel per world
    unit.
  </desc>
  <rect width="1056" height="890" fill="#070711" />
  <style>
  text {
    fill: #d5d8de;
    font: 13px monospace;
    text-anchor: middle;
  }
  .title {
    font: 600 18px sans-serif;
  }
  .note {
    fill: #9495a2;
    font-size: 11px;
  }
  .lit {
    --bed: #b97034;
    --core: #efbd78;
  }
  .dark {
    --bed: #493c30;
    --core: #675038;
  }
  .line {
    stroke: #2c303b;
    stroke-width: 1;
  }
  </style>
